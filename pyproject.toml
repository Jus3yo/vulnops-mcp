[project]
name = "vulnops-mcp"
version = "0.1.0"
description = "Custom MCP server for vulnerability management across Azure VMs, Tenable, Defender for Endpoint and Sentinel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "azure-identity>=1.17",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
vulnops-mcp = "vulnops_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnops_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "RUF", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["vulnops_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: hits real Azure/Tenable/Defender/Sentinel; run manually only"]

[tool.coverage.run]
source = ["vulnops_mcp"]
branch = true
omit = ["src/vulnops_mcp/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
